name: Deploy Branch to VPS via Docker Hub

on:
  push:
    branches:
      - test
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Забираем код
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Генерируем уникальный тег образа
      - name: Set image tag
        run: |
          IMAGE_TAG="sanjar883448/secore:${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "✅ Using image tag: $IMAGE_TAG"

      # 3️⃣ Собираем Docker образ
      - name: Build Docker image
        run: docker build -t $IMAGE_TAG .

      # 4️⃣ Логинимся в Docker Hub
      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      # 5️⃣ Публикуем образ
      - name: Push Docker image
        run: docker push $IMAGE_TAG

      # 6️⃣ Деплой на сервер
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GITHUB_REF_NAME,DB_CONNECTION_STRING
          script: |
            set -e

            if [ -z "$DB_CONNECTION_STRING" ]; then
              echo "❌ ERROR: GitHub Secret DB_CONNECTION_STRING is empty or not set."
              echo "   Expected format: Host=app_postgres;Port=5432;Database=appdb;Username=appuser;Password=..."
              exit 1
            fi

            if [ "$GITHUB_REF_NAME" == "test" ]; then
              PORT=8061
              CONTAINER=secoreNotificator
              ENVIRONMENT=Development
            elif [ "$GITHUB_REF_NAME" == "prod" ]; then
              PORT=8060
              CONTAINER=secoreNotificator
              ENVIRONMENT=Production
            fi

            echo "🚀 Deploying '$GITHUB_REF_NAME' build on port $PORT ..."
            echo "🧹 Cleaning up old containers and images..."

            docker stop $CONTAINER || true
            docker rm $CONTAINER || true
            docker image prune -af || true

            echo "🌐 Ensuring Docker network secore_net and postgres connectivity..."
            docker network create secore_net || true
            docker network connect secore_net app_postgres || true

            echo "📁 Ensuring host log directories /secore/..."
            if [ ! -d /secore/notificator ]; then
              if command -v sudo >/dev/null 2>&1; then
                sudo mkdir -p /secore/mainSystem /secore/notificator /secore/sheduler
                sudo chmod 777 /secore /secore/mainSystem /secore/notificator /secore/sheduler
              else
                echo "❌ Cannot create /secore (no sudo). Create once on server:"
                echo "   sudo mkdir -p /secore/mainSystem /secore/notificator /secore/sheduler && sudo chmod -R 777 /secore"
                exit 1
              fi
            else
              if command -v sudo >/dev/null 2>&1; then
                sudo mkdir -p /secore/mainSystem /secore/notificator /secore/sheduler
                sudo chmod 777 /secore/mainSystem /secore/notificator /secore/sheduler 2>/dev/null || true
              fi
            fi

            echo "⬇️ Pulling latest image: $IMAGE_TAG"
            docker pull $IMAGE_TAG

            echo "🧩 Starting new container..."
            docker run -d \
              --name $CONTAINER \
              --network secore_net \
              --restart always \
              -p $PORT:80 \
              -v /secore/notificator:/secore/notificator \
              -e ASPNETCORE_ENVIRONMENT=$ENVIRONMENT \
              -e ASPNETCORE_URLS=http://+:80 \
              -e ConnectionStrings__DefaultConnection="$DB_CONNECTION_STRING" \
              -e SecoreLogging__RootPath=/secore/notificator \
              -e SecoreLogging__FilePrefix=notificator \
              $IMAGE_TAG

            echo "✅ Deployment finished."
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            echo "📝 Logs volume: /secore/notificator"
            ls -la /secore/notificator || sudo ls -la /secore/notificator || true
